<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — Thomas Bierly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f4;
      --text: #1a1a1a;
      --text-mid: #555;
      --text-muted: #999;
      --accent: #b08d57;
      --border: #e0dcd4;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 2rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 400;
      margin-bottom: 1.5rem;
    }
    p {
      color: var(--text-mid);
      font-size: 1.1rem;
      max-width: 460px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    a.back {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      text-decoration: none;
      padding: 0.75rem 2rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: all 0.3s;
    }
    a.back:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .line {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <span class="label">Coming Soon</span>
  <h1>This project page is<br>on its way.</h1>
  <div class="line"></div>
  <p>I'm currently building out this page with more details, demos, and documentation. Check back soon.</p>
  <a href="../index.html" class="back">&larr; Back to home</a>
</body>
</html>
