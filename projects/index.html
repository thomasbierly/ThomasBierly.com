const SLUGS = ['negotiate','3am-tutor','meridian','tutor','book'];
const TAB_NAMES = { negotiate:'NEGOTIATE', '3am-tutor':'3AM Tutor', meridian:'Operation Meridian', tutor:'Tutor Scheduling', book:'Book' };

let currentSlug = 'negotiate';
let vignetteTimer = null;

function getSlug(){
  const h = (window.location.hash||'').replace('#','');
  return DATA[h] ? h : 'negotiate';
}

function render(){
  const slug = getSlug();
  currentSlug = slug;
  const p = DATA[slug];

  // page title
  document.title = p.name + ' — Thomas Bierly';

  // nav tabs
  const tabsEl = document.getElementById('nav-tabs');
  tabsEl.innerHTML = SLUGS.map(k => `
    <a class="nav-tab" href="#${k}">
      ${k===slug ? '<span class="nav-tab-dot"></span>' : ''}
      ${TAB_NAMES[k]}
    </a>`).join('');

  // hero
  document.getElementById('h-name').textContent = p.name;
  const fn = document.getElementById('h-fullname');
  fn.textContent = p.fullName || '';
  fn.style.display = p.fullName ? '' : 'none';
  document.getElementById('h-tagline').textContent = p.tagline;

  const statusBg = p.isLive ? 'rgba(123,224,160,.14)' : 'rgba(255,177,82,.14)';
  const statusFg = p.isLive ? '#7be0a0' : '#ffce8a';
  let actions = `
    <span class="status-pill" style="background:${statusBg};color:${statusFg}">
      <span class="status-led" style="background:${statusFg};box-shadow:0 0 8px ${statusFg}"></span>
      ${p.statusLabel}
    </span>
    <a class="btn-amber" href="mailto:tombierly@gmail.com">Talk to me about this →</a>`;
  if(p.liveUrl) actions += `<a class="btn-teal" href="${p.liveUrl}" target="_blank">Visit the platform ↗</a>`;
  document.getElementById('h-actions').innerHTML = actions;

  // problem
  document.getElementById('problem-paras').innerHTML = p.problem.map(t=>`<p class="problem-p">${t}</p>`).join('');

  // how it works
  document.getElementById('how-title').textContent = p.howTitle;
  document.getElementById('steps').innerHTML = p.howItWorks.map(s=>`
    <div class="step">
      <span class="step-n">${s.n}</span>
      <div><div class="step-title">${s.title}</div><p class="step-text">${s.text}</p></div>
    </div>`).join('');

  // features
  document.getElementById('features-title').textContent = p.featuresTitle;
  document.getElementById('features-grid').innerHTML = p.features.map(f=>`
    <div class="feature-card">
      <div class="feature-icon" style="background:${f.color}">${f.icon}</div>
      <div class="feature-title">${f.title}</div>
      <p class="feature-text">${f.text}</p>
    </div>`).join('');

  // shots
  document.getElementById('shots-grid').innerHTML = p.shots.map(s=>`
    <div class="shot-card"><div class="shot-placeholder"><span class="shot-label">${s}</span></div></div>`).join('');

  // tech
  document.getElementById('tech-title').textContent = p.techTitle;
  document.getElementById('tech-grid').innerHTML = p.tech.map(r=>`
    <div class="tech-row"><span class="tech-label">${r.label}</span><span class="tech-value">${r.value}</span></div>`).join('');

  window.scrollTo(0,0);
}

// Vignette canvas
function startVignette(){
  if(vignetteTimer) return;
  function tick(){ drawVignette(performance.now()); }
  tick();
  vignetteTimer = setInterval(tick, 66);
}

function drawVignette(t){
  const cv = document.getElementById('vignette'); if(!cv)return;
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  const f = t/1000, S = 4;
  const P = (x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect((x*S)|0,(y*S)|0,(w*S)|0,(h*S)|0); };
  ctx.clearRect(0,0,360,220);
  const slug = currentSlug;

  if(slug === 'negotiate'){
    P(0,0,90,55,'#1c1530');
    P(6,7,50,40,'#13102a'); P(6,7,50,3,'#2a2440');
    P(26,24,16,14,'#3b4d72');
    P(28,13,12,11,'#e8b48c'); P(28,13,12,3,'#cdaa6e');
    P(26,17,2,5,'#15111c'); P(40,17,2,5,'#15111c'); P(27,15,14,2,'#15111c');
    P(31,18,2,2,'#15111c'); P(36,18,2,2,'#15111c');
    for(let i=0;i<5;i++){const h=2+Math.round(Math.abs(Math.sin(f*4+i))*7);P(45+i*2,40-h,1,h,'#4fd6c2');}
    P(60,9,24,38,'#2e2233'); P(60,9,24,4,'#ffb152');
    for(let r=0;r<5;r++){P(63,18+r*5,15,1,'#6a5765');P(80,18+r*5,2,1,'#9be07a');}
  }
  else if(slug === '3am-tutor'){
    P(0,0,90,55,'#141a30');
    P(10,8,1,1,'#fff');P(46,6,1,1,'#fff');P(70,30,1,1,'#fff');P(20,40,1,1,'#fff');
    P(68,8,11,11,'#f3e6b0');P(71,8,8,11,'#141a30');
    P(22,18,30,30,'#2e2233');P(25,21,24,24,'#15111f');
    P(36,32,2,2,'#ffb152');
    P(37,33,8,1,'#ffce8a');
    P(36,24,1,9,'#fff');
    const sx=Math.round(Math.cos(f*1.6)*8),sy=Math.round(Math.sin(f*1.6)*8);
    P(36+sx,32+sy,1,1,'#4fd6c2');
    P(56,26,26,15,'#ffb152');P(60,41,4,4,'#ffb152');
    const d=Math.sin(f*3)>0?1:0;
    P(61,32,3,3,'#2a1820');P(67,32,3,3,d?'#2a1820':'#c8852f');P(73,32,3,3,'#2a1820');
  }
  else if(slug === 'meridian'){
    P(0,0,90,55,'#1c1530');
    P(8,7,74,5,'#2e2233');P(8,7,20,5,'#4fd6c2');
    const cols=['#4fd6c2','#ffb152','#ff7a6b','#9be07a'];
    for(let i=0;i<4;i++){
      const bx=14+i*18;
      P(bx,42,12,2,'#2e2233');
      const h=10+Math.round((0.5+0.5*Math.sin(f*1.1+i*1.3))*20);
      P(bx,42-h,12,h,cols[i]);P(bx,42-h,12,2,'rgba(255,255,255,.4)');
      P(bx+4,46,4,2,cols[i]);
    }
  }
  else if(slug === 'tutor'){
    P(0,0,90,55,'#1c1530');
    P(8,7,74,7,'#ffb152');P(11,9,10,3,'#2a1820');
    for(let r=0;r<4;r++) for(let c=0;c<6;c++) P(9+c*12,17+r*8,11,7,'#2e2233');
    P(9+1*12,17+0*8,11,7,'#4fd6c2');P(9+3*12,17+1*8,11,7,'#9be07a');
    P(9+0*12,17+2*8,11,7,'#ff7a6b');P(9+4*12,17+3*8,11,7,'#4fd6c2');
    const on=Math.sin(f*2.5)>0;if(on)P(9+2*12,17+2*8,11,7,'#ffb152');
  }
  else {
    P(0,0,90,55,'#1c1530');
    P(28,11,34,34,'#b5683f');P(28,11,6,34,'#8a4f30');P(34,11,28,2,'#c87a4e');
    P(40,19,16,2,'#f3e6d6');P(40,24,12,2,'#f3e6d6');
    P(42,31,3,7,'#fff');P(46,31,3,7,'#fff');P(50,31,3,7,'#fff');
    const bm=Math.round(Math.abs(Math.sin(f*1.3))*3);
    P(56,11,3,38+bm,'#4fd6c2');
  }
}

window.addEventListener('hashchange', render);
render();
startVignette();
</script>
