html{scroll-behavior:smooth}

::-webkit-scrollbar-track{background:#160e18}
::-webkit-scrollbar-thumb{background:#3a2d40;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#4c3c54}

a{text-decoration:none;color:inherit}

nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(26,18,28,.82);border-bottom:2px solid #160e18}
.nav-inner{max-width:1080px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nav-brand{display:flex;align-items:center;gap:8px;padding:4px 2px}
.nav-brand-mono{font-family:'Baloo 2';font-weight:800;font-size:17px;color:var(--neon);text-shadow:1px 1px 0 #160e18}
.nav-brand-name{font-family:'Baloo 2';font-weight:700;font-size:16px;color:#f3e7db}
.nav-tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav-tab{display:flex;align-items:center;gap:6px;font-family:'Baloo 2';font-weight:600;font-size:13.5px;color:#d9c6bc;padding:7px 12px;border-radius:8px;transition:background .15s,color .15s}

.nav-tab-dot{width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 7px var(--neon)}
.page-wrap{max-width:1080px;margin:0 auto;padding:0 22px 70px}

/* hero */
.back-link{display:inline-flex;align-items:center;gap:7px;font:600 13px Nunito;color:#bda3b4;margin-bottom:18px;transition:color .15s;padding-top:30px}

.hero-row{display:flex;gap:30px;flex-wrap:wrap;align-items:center;padding-bottom:8px}

.hero-h1{font-family:'Baloo 2';font-weight:800;font-size:52px;line-height:1;color:#fff;text-shadow:2px 2px 0 #160e18}
.hero-fullname{font:600 13px Nunito;color:#a98fa0;margin-top:10px;max-width:560px;line-height:1.4}
.hero-tagline{font-size:17px;line-height:1.55;color:#ecd9cd;margin:16px 0 18px;max-width:560px}
.hero-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.status-pill{display:inline-flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:700;font-size:13px;padding:8px 14px;border-radius:30px;border:2px solid #160e18}
.status-led{width:8px;height:8px;border-radius:50%;animation:ledpulse 2.2s infinite;animation-play-state:var(--anim,running)}
.status-led-off{animation:none;opacity:.55;box-shadow:none}
.btn-amber{font-family:'Baloo 2';font-weight:700;font-size:13px;padding:9px 18px;border:2px solid #160e18;background:var(--neon);color:#2a1820;box-shadow:4px 4px 0 #160e18;transition:transform .12s,box-shadow .12s;display:inline-block}

.section-h2{font-family:'Baloo 2';font-weight:700;font-size:26px;color:#fff;margin:0 0 20px}
.steps{display:flex;flex-direction:column;gap:14px}

.step-n-text{font-size:12px;letter-spacing:.04em}
.step-title{font-family:'Baloo 2';font-weight:700;font-size:17px;color:#fff;margin-bottom:3px}
.step-text{font-size:14px;line-height:1.6;color:#d3bfca}

/* features */
.features-section{margin-top:38px}
.features-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.feature-card{border:2px solid #160e18;border-radius:12px;background:#2e2233;box-shadow:5px 5px 0 rgba(0,0,0,.28);padding:18px 18px 20px}
.feature-icon{width:30px;height:30px;border:2px solid #160e18;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;color:#2a1820;margin-bottom:12px;font-size:14px}
.feature-title{font-family:'Baloo 2';font-weight:700;font-size:16px;color:#fff;margin-bottom:5px}
.feature-text{font-size:13.5px;line-height:1.6;color:#d3bfca}

/* screenshots */
.shots-section{margin-top:38px}
.shots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.shot-card{border:2px solid #160e18;border-radius:12px;overflow:hidden;box-shadow:5px 5px 0 rgba(0,0,0,.28)}
.shot-placeholder{aspect-ratio:16/10;background:repeating-linear-gradient(135deg,#2c2138,#2c2138 11px,#332742 11px,#332742 22px);display:flex;align-items:center;justify-content:center}
.shot-label{font:500 11px 'IBM Plex Mono';color:#b9a3c4;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:6px}
.shot-card-img{grid-column:1/-1;background:#1d1320}
.shot-card-img img{display:block;width:100%;height:auto}
.shots-note{font:500 12px 'IBM Plex Mono';color:#8d7790;margin-top:12px}
.shots-caption{font-size:13.5px;line-height:1.6;color:#b9a3c4;margin-top:12px;max-width:760px}

/* tech */
.tech-panel{margin-top:38px;border:2px solid #160e18;border-radius:14px;background:#1f1828;box-shadow:6px 6px 0 rgba(0,0,0,.3);padding:26px 30px}
.tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px 26px}
.tech-row{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.tech-label{flex:0 0 120px;font:600 12px 'IBM Plex Mono';color:var(--neon2)}
.tech-value{font-size:13.5px;line-height:1.5;color:#dcc8d2}
.tech-value a,.problem-p a,.step-text a,.feature-text a{color:#ffce8a;border-bottom:1px solid rgba(255,206,138,.4)}
.tech-value a:hover,.problem-p a:hover,.step-text a:hover,.feature-text a:hover{color:#fff}

/* footer */
.page-footer{margin-top:46px;text-align:center}
.btn-back{display:inline-block;font-family:'Baloo 2';font-weight:700;font-size:14px;padding:12px 24px;border:2px solid #160e18;background:#2e2233;color:#ffce8a;box-shadow:5px 5px 0 rgba(0,0,0,.3);transition:transform .12s,box-shadow .12s}
.btn-back:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.footer-copy{margin-top:26px;font:500 11px 'IBM Plex Mono';color:#8a6f80}

@media(max-width:600px){
  .hero-h1{font-size:38px}
  .vignette-frame{flex:0 0 100%}
}
</style>

const SLUGS = ['augmenti','negotiate','3am-tutor','meridian','teaching-allocation-hub','ai-flow-studio','cadence','book'];
const TAB_NAMES = { augmenti:'Augmenti', negotiate:'NEGOTIATE', '3am-tutor':'3AM Tutor', meridian:'Operation Meridian', 'teaching-allocation-hub':'Teaching Allocation Hub', 'ai-flow-studio':'AI Flow Studio', cadence:'Cadence', book:'Book' };
const STATUS_TONES = { live:['rgba(123,224,160,.14)','#7be0a0'], dev:['rgba(255,177,82,.14)','#ffce8a'], archived:['rgba(201,179,214,.16)','#c9b3d6'] };

let currentSlug = 'augmenti';
let vignetteTimer = null;

// Slugs that have been renamed. Old links keep working and quietly land on the new one.
const SLUG_ALIASES = { tutor: 'teaching-allocation-hub' };

function getSlug(){
  const h = (window.location.hash||'').replace('#','');
  if(SLUG_ALIASES[h]){
    const target = SLUG_ALIASES[h];
    // replaceState doesn't fire hashchange, so this won't re-enter render()
    history.replaceState(null, '', '#' + target);
    return target;
  }
  return DATA[h] ? h : 'augmenti';
}

function render(){
  const slug = getSlug();
  currentSlug = slug;
  const p = DATA[slug];

  // page title
  document.title = p.name + ' — Thomas Bierly';

  // nav tabs
  const tabsEl = document.getElementById('nav-tabs');
  tabsEl.innerHTML = SLUGS.map(k => `
    <a class="nav-tab" href="#${k}">
      ${k===slug ? '<span class="nav-tab-dot"></span>' : ''}
      ${TAB_NAMES[k]}
    </a>`).join('');

  // hero
  document.getElementById('h-name').textContent = p.name;
  const fn = document.getElementById('h-fullname');
  fn.textContent = p.fullName || '';
  fn.style.display = p.fullName ? '' : 'none';
  document.getElementById('h-tagline').textContent = p.tagline;

  const [statusBg, statusFg] = STATUS_TONES[p.tone] || STATUS_TONES.dev;
  const ledClass = p.tone === 'archived' ? 'status-led status-led-off' : 'status-led';
  let actions = `
    <span class="status-pill" style="background:${statusBg};color:${statusFg}">
      <span class="${ledClass}" style="background:${statusFg};box-shadow:0 0 8px ${statusFg}"></span>
      ${p.statusLabel}
    </span>
    <a class="btn-amber" href="mailto:hello@thomasbierly.com">Talk to me about this →</a>`;
  (p.actions||[]).forEach(a => {
    const ext = a.external ? ' target="_blank" rel="noopener"' : '';
    actions += `<a class="btn-teal" href="${a.href}"${ext}>${a.label}</a>`;
  });
  document.getElementById('h-actions').innerHTML = actions;

  // problem
  document.getElementById('problem-paras').innerHTML = p.problem.map(t=>`<p class="problem-p">${t}</p>`).join('');

  // how it works
  document.getElementById('how-title').textContent = p.howTitle;
  document.getElementById('steps').innerHTML = p.howItWorks.map(s=>`
    <div class="step">
      <span class="step-n${typeof s.n === 'number' ? '' : ' step-n-text'}">${s.n}</span>
      <div><div class="step-title">${s.title}</div><p class="step-text">${s.text}</p></div>
    </div>`).join('');

  // features
  document.getElementById('features-title').textContent = p.featuresTitle;
  document.getElementById('features-grid').innerHTML = p.features.map(f=>`
    <div class="feature-card">
      <div class="feature-icon" style="background:${f.color}">${f.icon}</div>
      <div class="feature-title">${f.title}</div>
      <p class="feature-text">${f.text}</p>
    </div>`).join('');

  // shots — a string renders a placeholder, an object renders a real screenshot
  document.getElementById('shots-grid').innerHTML = p.shots.map(s => typeof s === 'string'
    ? `<div class="shot-card"><div class="shot-placeholder"><span class="shot-label">${s}</span></div></div>`
    : `<div class="shot-card shot-card-img"><a href="${s.img}" target="_blank" rel="noopener"><img src="${s.img}" alt="${s.alt}"></a></div>`
  ).join('');
  const hasReal = p.shots.some(s => typeof s !== 'string');
  document.getElementById('shots-note').style.display = hasReal ? 'none' : '';
  const cap = document.getElementById('shots-caption');
  cap.textContent = p.shotsCaption || '';
  cap.style.display = p.shotsCaption ? '' : 'none';

  // tech
  document.getElementById('tech-title').textContent = p.techTitle;
  document.getElementById('tech-grid').innerHTML = p.tech.map(r=>`
    <div class="tech-row"><span class="tech-label">${r.label}</span><span class="tech-value">${r.value}</span></div>`).join('');

  window.scrollTo(0,0);
}

// Vignette canvas
function startVignette(){
  if(vignetteTimer) return;
  function tick(){ drawVignette(performance.now()); }
  tick();
  vignetteTimer = setInterval(tick, 66);
}

function drawVignette(t){
  const cv = document.getElementById('vignette'); if(!cv)return;
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  const f = t/1000, S = 4;
  const P = (x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect((x*S)|0,(y*S)|0,(w*S)|0,(h*S)|0); };
  ctx.clearRect(0,0,360,220);
  const slug = currentSlug;

  if(slug === 'negotiate'){
    P(0,0,90,55,'#1c1530');
    P(6,7,50,40,'#13102a'); P(6,7,50,3,'#2a2440');
    P(26,24,16,14,'#3b4d72');
    P(28,13,12,11,'#e8b48c'); P(28,13,12,3,'#cdaa6e');
    P(26,17,2,5,'#15111c'); P(40,17,2,5,'#15111c'); P(27,15,14,2,'#15111c');
    P(31,18,2,2,'#15111c'); P(36,18,2,2,'#15111c');
    for(let i=0;i<5;i++){const h=2+Math.round(Math.abs(Math.sin(f*4+i))*7);P(45+i*2,40-h,1,h,'#4fd6c2');}
    P(60,9,24,38,'#2e2233'); P(60,9,24,4,'#ffb152');
    for(let r=0;r<5;r++){P(63,18+r*5,15,1,'#6a5765');P(80,18+r*5,2,1,'#9be07a');}
  }
  else if(slug === '3am-tutor'){
    P(0,0,90,55,'#141a30');
    P(10,8,1,1,'#fff');P(46,6,1,1,'#fff');P(70,30,1,1,'#fff');P(20,40,1,1,'#fff');
    P(68,8,11,11,'#f3e6b0');P(71,8,8,11,'#141a30');
    P(22,18,30,30,'#2e2233');P(25,21,24,24,'#15111f');
    P(36,32,2,2,'#ffb152');
    P(37,33,8,1,'#ffce8a');
    P(36,24,1,9,'#fff');
    const sx=Math.round(Math.cos(f*1.6)*8),sy=Math.round(Math.sin(f*1.6)*8);
    P(36+sx,32+sy,1,1,'#4fd6c2');
    P(56,26,26,15,'#ffb152');P(60,41,4,4,'#ffb152');
    const d=Math.sin(f*3)>0?1:0;
    P(61,32,3,3,'#2a1820');P(67,32,3,3,d?'#2a1820':'#c8852f');P(73,32,3,3,'#2a1820');
  }
  else if(slug === 'meridian'){
    P(0,0,90,55,'#1c1530');
    P(8,7,74,5,'#2e2233');P(8,7,20,5,'#4fd6c2');
    const cols=['#4fd6c2','#ffb152','#ff7a6b','#9be07a'];
    for(let i=0;i<4;i++){
      const bx=14+i*18;
      P(bx,42,12,2,'#2e2233');
      const h=10+Math.round((0.5+0.5*Math.sin(f*1.1+i*1.3))*20);
      P(bx,42-h,12,h,cols[i]);P(bx,42-h,12,2,'rgba(255,255,255,.4)');
      P(bx+4,46,4,2,cols[i]);
    }
  }
  else if(slug === 'teaching-allocation-hub'){
    P(0,0,90,55,'#1c1530');
    P(8,7,74,7,'#ffb152');P(11,9,10,3,'#2a1820');
    for(let r=0;r<4;r++) for(let c=0;c<6;c++) P(9+c*12,17+r*8,11,7,'#2e2233');
    P(9+1*12,17+0*8,11,7,'#4fd6c2');P(9+3*12,17+1*8,11,7,'#9be07a');
    P(9+0*12,17+2*8,11,7,'#ff7a6b');P(9+4*12,17+3*8,11,7,'#4fd6c2');
    const on=Math.sin(f*2.5)>0;if(on)P(9+2*12,17+2*8,11,7,'#ffb152');
  }
  else if(slug === 'ai-flow-studio'){
    P(0,0,90,55,'#1c1530');
    for(let y=4;y<52;y+=6) for(let x=4;x<88;x+=6) P(x,y,1,1,'#2b2140');
    const ncols=['#4fd6c2','#9be07a','#ffb152','#c79bff'];
    for(let i=0;i<4;i++){
      const nx=5+i*21;
      P(nx,9,15,13,'#2e2233');
      P(nx,9,15,3,ncols[i]);
      P(nx+2,15,10,1,'#6a5765');
      P(nx+2,18,7,1,'#6a5765');
      if(i<3) P(nx+15,15,6,1,'#4a3c52');
    }
    P(5+((f*14)%78)|0,15,2,1,'#ffb152');
    P(12,22,1,6,'#4a3c52'); P(12,28,18,1,'#4a3c52');
    P(30,28,14,9,'#2e2233'); P(30,28,14,3,'#c79bff');
    P(33,33,3,2, Math.sin(f*1.7)>0 ? '#9be07a' : '#ff7a6b');
    P(38,33,4,1,'#6a5765');
    P(44,32,8,1,'#4a3c52');
    P(52,26,26,25,'#f3e6d6'); P(52,26,26,4,'#ffb152');
    for(let r=0;r<5;r++) P(55,34+r*4,18,1,'#b8a795');
    P(55,34,12,1,'#8a7a68');
  }
  else if(slug === 'augmenti'){
    P(0,0,90,55,'#1c1530');
    const ph=['#A78BFA','#8B5CF6','#7C3AED','#6D28D9'];
    const active=Math.floor(f/1.5)%4;
    for(let i=0;i<4;i++) P(6+i*10,5,8,3, i===active ? ph[i] : '#3a2d44');
    P(4,11,32,40,'#2e2233');
    P(8,15,8,8,'#A78BFA');
    for(let r=0;r<5;r++) P(8,26+r*4,Math.max(8,22-r*3),2,'#4a3c52');
    P(38,11,48,40,'#241a2e');
    const st=[[42,15],[56,15],[70,15],[42,26],[56,26],[70,26],[42,37],[56,37]];
    st.forEach((c,i)=>{ P(c[0],c[1],12,8,ph[i%4]); P(c[0],c[1],12,2,'rgba(255,255,255,.35)'); });
    if(Math.sin(f*3)>0){ P(70,37,12,8,'#ffb152'); P(70,37,12,2,'rgba(255,255,255,.45)'); }
  }
  else if(slug === 'cadence'){
    P(0,0,90,55,'#1c1530');
    P(4,4,66,47,'#241a2e');
    for(let d=0;d<5;d++){ const cx=8+d*12; P(cx,8,9,39,'#2e2233'); P(cx,8,9,3,'#3b2d44'); }
    [[0,14,6],[1,20,5],[2,12,4],[3,26,7],[4,16,5]].forEach(b=>P(8+b[0]*12,b[1],9,b[2],'#4a3c52'));
    P(32,22,9,8, Math.sin(f*2.2)>0 ? '#ffb152' : '#7a5a34');
    P(70,4,16,47,'#171022'); P(70,4,16,3,'#4fd6c2');
    const acols=['#7aa2f7','#9ece6a','#ff9e64','#bb9af7','#7aa2f7'];
    for(let i=0;i<5;i++){
      P(72,11+i*8,2,2,acols[i]);
      P(75,11+i*8,9,1,'#6a5765');
      P(75,13+i*8,6,1,'#4a3c52');
    }
    P(72,45,5,4,'#f3e6d6'); P(72,45,5,1,'#ff7a6b');
  }
  else {
    P(0,0,90,55,'#1c1530');
    P(28,11,34,34,'#b5683f');P(28,11,6,34,'#8a4f30');P(34,11,28,2,'#c87a4e');
    P(40,19,16,2,'#f3e6d6');P(40,24,12,2,'#f3e6d6');
    P(42,31,3,7,'#fff');P(46,31,3,7,'#fff');P(50,31,3,7,'#fff');
    const bm=Math.round(Math.abs(Math.sin(f*1.3))*3);
    P(56,11,3,38+bm,'#4fd6c2');
  }
}

window.addEventListener('hashchange', render);
render();
startVignette();
</script>
